<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Abdyleziz Sopyyev — Full-Stack Developer">
  <defs>
    <!-- Background Grid -->
    <pattern id="techGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
      <circle cx="36" cy="36" r="0.75" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Glowing Text Gradient (White -> Cyan/Blue -> Vibrant Orange) -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Animated Shimmer for Name -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0; 900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Deep Ambient Glow Orbs -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerWhiteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Typing Mask for Terminal -->
    <clipPath id="terminalClip">
      <rect x="250" y="202" height="32" width="0">
        <animate attributeName="width" calcMode="discrete" 
          values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;375;390;405;405;405;405;405;405;405;0" 
          keyTimes="0.00;0.02;0.04;0.06;0.08;0.10;0.12;0.14;0.16;0.18;0.20;0.22;0.24;0.26;0.28;0.30;0.32;0.34;0.36;0.38;0.40;0.42;0.44;0.46;0.48;0.50;0.52;0.54;0.56;0.58;0.60;0.63;0.66;0.70;0.75;0.80;0.85;0.90;0.95;0.98;1.00" 
          dur="8.5s" begin="2.6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- Filter for subtle outer glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian / OLED Black Background -->
  <rect width="900" height="340" rx="16" fill="#08090d"/>
  
  <!-- Subtle Sleek Border -->
  <rect width="898" height="338" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Tech Dots / Grid Pattern -->
  <rect width="900" height="340" rx="16" fill="url(#techGrid)"/>

  <!-- Fluid Ambient Lighting Orbs (Blue & Orange Accent) -->
  <circle cx="280" cy="110" r="180" fill="url(#blueGlow)">
    <animate attributeName="cx" values="280;360;280" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;150;110" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="640" cy="150" r="170" fill="url(#orangeGlow)">
    <animate attributeName="cx" values="640;560;640" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;110;150" dur="10s" repeatCount="indefinite"/>
  </circle>

  <circle cx="450" cy="140" r="140" fill="url(#centerWhiteGlow)"/>

  <!-- Cyber Dust Floating Particles -->
  <!-- Blue particles -->
  <circle cx="180" r="1.5" fill="#38bdf8" opacity="0"><animate attributeName="cy" values="330;10" dur="8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="310" r="2" fill="#38bdf8" opacity="0"><animate attributeName="cy" values="330;10" dur="10s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="10s" begin="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="480" r="1.2" fill="#38bdf8" opacity="0"><animate attributeName="cy" values="330;10" dur="7.5s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="7.5s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="780" r="1.8" fill="#38bdf8" opacity="0"><animate attributeName="cy" values="330;10" dur="9s" begin="4.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="9s" begin="4.0s" repeatCount="indefinite"/></circle>

  <!-- Orange particles -->
  <circle cx="230" r="1.8" fill="#f97316" opacity="0"><animate attributeName="cy" values="330;10" dur="9.5s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9.5s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="620" r="2.2" fill="#f97316" opacity="0"><animate attributeName="cy" values="330;10" dur="8.2s" begin="3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="8.2s" begin="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="710" r="1.3" fill="#f97316" opacity="0"><animate attributeName="cy" values="330;10" dur="11s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="11s" begin="0.8s" repeatCount="indefinite"/></circle>

  <!-- Top Status Badge: Open to Remote (Electric Green + Frosted pill) -->
  <g transform="translate(856, 32)">
    <rect x="-142" y="-14" width="138" height="26" rx="13" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="-126" cy="-1" r="4.5" fill="#10b981">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="-114" y="3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" letter-spacing="0.3">open to remote</text>
  </g>

  <!-- Decorative Top Corner Tech Accent (Cyan & Orange) -->
  <path d="M 32 40 L 32 32 L 40 32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 46 32 L 56 32" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>

  <!-- MAIN NAME: Glowing Stroke Reveal -> Gradient Fill -->
  <g filter="url(#softGlow)">
    <text x="450" y="132" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="600" stroke-dashoffset="600">
      Abdyleziz Sopyyev
      <animate attributeName="stroke-dashoffset" values="600;0" dur="2s" begin="0.2s" fill="freeze"/>
      <animate attributeName="stroke-opacity" values="1;0" dur="0.8s" begin="1.9s" fill="freeze"/>
    </text>
  </g>

  <text x="450" y="132" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5" fill="url(#shimmer)" fill-opacity="0">
    Abdyleziz Sopyyev
    <animate attributeName="fill-opacity" values="0;1" dur="0.8s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- SUBTITLE: Crisp White / Ice Blue with Spaced Kerning -->
  <text x="450" y="174" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="700" letter-spacing="6" fill="#f8fafc" opacity="0">
    FULL-STACK WEB · MOBILE · AUTOMATION
    <animate attributeName="opacity" values="0;0.95" dur="0.8s" begin="2.1s" fill="freeze"/>
    <animate attributeName="letter-spacing" values="14;6" dur="1s" begin="2.1s" fill="freeze"/>
  </text>

  <!-- TERMINAL COMMAND BOX: Dark Glass + Cyan '$' Prompt + Typewriter Code -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/>

    <!-- Terminal Prompt '$' -->
    <text x="230" y="222" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="15" font-weight="800" fill="#38bdf8">$</text>

    <!-- Typing Text -->
    <g clip-path="url(#terminalClip)">
      <text x="250" y="222" font-family="'JetBrains Mono',Consolas,Menlo,monospace" font-size="14.5" font-weight="500" fill="#e2e8f0" letter-spacing="0.2" textLength="405" lengthAdjust="spacingAndGlyphs">ship --scalable-systems --high-performance</text>
    </g>

    <!-- Glowing Blinking Cursor (Orange Accent) -->
    <rect y="208" width="8" height="17" rx="1.5" fill="#f97316">
      <animate attributeName="x" calcMode="discrete" 
        values="250;262;274;286;298;310;322;334;346;358;370;382;394;406;418;430;442;454;466;478;490;502;514;526;538;550;562;574;586;598;610;625;640;655;655;655;655;655;655;655;250" 
        keyTimes="0.00;0.02;0.04;0.06;0.08;0.10;0.12;0.14;0.16;0.18;0.20;0.22;0.24;0.26;0.28;0.30;0.32;0.34;0.36;0.38;0.40;0.42;0.44;0.46;0.48;0.50;0.52;0.54;0.56;0.58;0.60;0.63;0.66;0.70;0.75;0.80;0.85;0.90;0.95;0.98;1.00" 
        dur="8.5s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- TECH STACK PILLS (Frosted Dark Glass + Alternating Blue & Orange Trim) -->
  
  <!-- 1. Laravel (Orange Tinted Edge) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.5s" begin="2.8s" fill="freeze"/>
    <rect x="208" y="266" width="86" height="30" rx="8" fill="#131722" stroke="#f97316" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="224" cy="281" r="3" fill="#f97316"/>
    <text x="257" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">Laravel</text>
  </g>

  <!-- 2. React (Cyan Blue Tinted Edge) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.5s" begin="3.0s" fill="freeze"/>
    <rect x="306" y="266" width="82" height="30" rx="8" fill="#131722" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="321" cy="281" r="3" fill="#38bdf8"/>
    <text x="353" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">React</text>
  </g>

  <!-- 3. Flutter (Cyan Blue Tinted Edge) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.5s" begin="3.2s" fill="freeze"/>
    <rect x="400" y="266" width="86" height="30" rx="8" fill="#131722" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="416" cy="281" r="3" fill="#38bdf8"/>
    <text x="449" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">Flutter</text>
  </g>

  <!-- 4. Python (Clean White/Ice Tinted Edge) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.5s" begin="3.4s" fill="freeze"/>
    <rect x="498" y="266" width="88" height="30" rx="8" fill="#131722" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="514" cy="281" r="3" fill="#e2e8f0"/>
    <text x="548" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">Python</text>
  </g>

  <!-- 5. MQL5 (Orange Tinted Edge) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.5s" begin="3.6s" fill="freeze"/>
    <rect x="598" y="266" width="82" height="30" rx="8" fill="#131722" stroke="#f97316" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="613" cy="281" r="3" fill="#f97316"/>
    <text x="645" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">MQL5</text>
  </g>
</svg>
